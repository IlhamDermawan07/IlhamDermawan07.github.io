<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ILHAM
      DERMAWAN 
    </title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"
    />
  </head>
  <body
    style="
      background-image: url(https://images.unsplash.com/photo-1670308268425-6948df38f7a2?q=80&w=327&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D);
    "
    class="flex justify-center h-screen items-center"
  >
    <div
      class="bg-white border px-10 py-8 border-4 border-gray-300 shadow-lg shadow-blue rounded-xl text center animate__animated animate__backInDown m-8 w-80"
      id="kartu"
    >
      <h1 class="text-3xl">Happy Birthday</h1>
      <h1
        class="text-4xl text-blue-500 font-bold animate__animated animate__pulse animate__infinite"
      >
        KAMU
      </h1>
      <button
        class="p-2 bg-blue-600 text-white rounded mt-5 hover:bg-blue-900 transition ease-in w-full animate__animated animate__delay-1s animate__tada"
        onclick="ubahKartu()"
      >
        klik Disini!
      </button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@tsparticles/confetti@4.0.5/tsparticles.confetti.bundle.min.js"></script>
    <script>
      confetti({
        particleCount: 100,
        spread: 70,
        origin: { y: 0.6 },
      });
      let kartu = document.getElementById("kartu");

      function ubahKartu() {
        kartu.innerHTML = `
        <h1 class="font-semibold text-wrap animate__animated animate__zoomIn">
            Selamat ulang tahun. 🎂🤲<br><br>
            Semoga Allah senantiasa melimpahkan rahmat, kesehatan, rezeki yang berkah, dan kebahagiaan untukmu.
            Semoga umur yang diberikan menjadi umur yang bermanfaat, penuh kebaikan, dan membawa banyak keberkahan bagi diri sendiri maupun orang-orang di sekitarmu.
        </h1>

        <h2 class="mt-3 animate__animated animate__fadeIn">
            ~ Dari : Om Ilham ~
        </h2>

        <button
            class="p-2 bg-slate-600 text-white rounded mt-5 hover:bg-slate-900 transition ease-in w-full animate__animated animate__delay-1s animate__tada"
            onclick="refreshPage()"
        >
            Tutup
        </button>
    `;
      }

      function refreshPage() {
        location.reload();
      }
    </script>
  </body>
</html>
